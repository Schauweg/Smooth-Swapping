architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    developmentNeoForge.extendsFrom common
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${project.forge_version}"

    common(project(path: ":common")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

def CHANGELOG = new File(rootProject.projectDir.getAbsolutePath(), "CHANGELOG.md").text
def SUPPORTED_VERSIONS = Arrays.asList(project.supported_versions.split(','))

unifiedPublishing {
    project {
        displayName = "[NeoForge $project.minecraft_version] v$project.version"
        releaseType = "$rootProject.artifact_type"
        changelog = CHANGELOG
        gameVersions = SUPPORTED_VERSIONS
        gameLoaders = ["neoforge"]
        mainPublication tasks.shadowJar

        var CURSE_API_KEY = System.getenv("CURSEFORGE_API_KEY")
        if (CURSE_API_KEY != null) {
            curseforge {
                token = CURSE_API_KEY
                id = rootProject.curseforge_id
                gameVersions = SUPPORTED_VERSIONS
            }
        }

        var MODRINTH_TOKEN = System.getenv("MODRINTH_TOKEN")
        if (MODRINTH_TOKEN != null) {
            modrinth {
                token = MODRINTH_TOKEN
                id = rootProject.modrinth_id
                version = "$rootProject.mod_version-$rootProject.minecraft_version"
            }
        }
    }
}